<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · Empanadas Guayacán 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --azul:#0B2A5B; --rojo:#D52B1E; --verde:#1C8A4A; --crema:#FBF7EF; --linea:#E4DCC9; }
  *{box-sizing:border-box;}
  body{font-family:'Inter',sans-serif; background:var(--crema); margin:0; color:#1B1D22;}
  header{background:var(--azul); color:#fff; padding:18px 20px; text-align:center;}
  header h1{font-family:'Anton'; font-weight:400; font-size:22px; margin:0; letter-spacing:.02em;}
  header p{margin:4px 0 0; font-size:12.5px; color:#B9CCF0;}
  main{max-width:960px; margin:0 auto; padding:20px 16px 60px;}

  .toolbar{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px; align-items:center;}
  .toolbar select, .toolbar input{
    padding:9px 12px; border-radius:8px; border:1.5px solid #DDD3BC; font-family:'Inter'; font-size:13.5px;
  }
  .toolbar button{
    padding:9px 16px; border-radius:8px; border:none; background:var(--azul); color:#fff;
    font-weight:700; font-size:13px; cursor:pointer;
  }
  .toolbar .stock-pill{
    background:#fff; border:1.5px solid var(--linea); border-radius:999px; padding:7px 14px;
    font-size:12.5px; font-weight:700; color:#555;
  }

  table{width:100%; border-collapse:collapse; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 4px 16px rgba(11,42,91,0.08);}
  thead th{
    background:var(--azul); color:#fff; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em;
    padding:10px 8px; text-align:left;
  }
  tbody td{padding:9px 8px; font-size:13px; border-bottom:1px solid #F0EAD9; vertical-align:middle;}
  tbody tr:hover{background:#FBF7EF;}

  .badge{padding:4px 9px; border-radius:999px; font-size:11px; font-weight:800;}
  .badge.Pendiente{background:#FFF1CC; color:#8A6100;}
  .badge.Verificado{background:#DFF3E5; color:var(--verde);}
  .badge.Rechazado{background:#FBE0DE; color:var(--rojo);}
  .badge.Entregado{background:#DCE6F5; color:var(--azul);}

  .actions{display:flex; flex-wrap:wrap; gap:4px;}
  .actions button{
    border:none; border-radius:6px; padding:6px 9px; font-size:11px; font-weight:700; cursor:pointer;
  }
  .btn-ok{background:var(--verde); color:#fff;}
  .btn-no{background:var(--rojo); color:#fff;}
  .btn-wsp{background:#25D366; color:#fff;}
  .btn-entregado{background:var(--azul); color:#fff;}
  .btn-print{background:#5A4A32; color:#fff;}
  .actions button:disabled{background:#ddd; color:#999; cursor:not-allowed;}

  .empty{text-align:center; padding:40px; color:#999; font-size:14px;}
  .loading{text-align:center; padding:40px; color:#999; font-size:14px;}

  /* Tabs */
  .tabs{display:flex; gap:8px; margin-bottom:16px;}
  .tabs button{
    flex:1; padding:11px; border-radius:10px; border:1.5px solid var(--linea); background:#fff;
    font-weight:800; font-size:13.5px; cursor:pointer; color:#666;
  }
  .tabs button.active{background:var(--azul); color:#fff; border-color:var(--azul);}

  /* Caja rápida */
  .caja-card{background:#fff; border-radius:16px; padding:20px; box-shadow:0 4px 16px rgba(11,42,91,0.08); max-width:460px; margin:0 auto;}
  .caja-prod{display:flex; align-items:center; gap:12px; padding:12px; border-radius:12px; margin-bottom:10px;}
  .caja-prod.pino{background:#F4E7D6;}
  .caja-prod.queso{background:#FEF3D9;}
  .caja-prod .nombre{flex:1; font-weight:800; font-size:14.5px;}
  .caja-prod .disp{font-size:11px; color:#777; font-weight:600;}
  .caja-stepper{display:flex; align-items:center; gap:8px;}
  .caja-stepper button{
    width:30px; height:30px; border-radius:50%; border:none; cursor:pointer; font-size:16px;
    font-weight:800; color:#fff; background:var(--azul);
  }
  .caja-stepper button:disabled{background:#ccc;}
  .caja-stepper .qty{width:24px; text-align:center; font-weight:800;}

  .caja-total{
    display:flex; justify-content:space-between; align-items:center; padding:14px 0;
    border-top:2px dashed var(--linea); border-bottom:2px dashed var(--linea); margin:14px 0;
  }
  .caja-total .num{font-family:'Anton'; font-size:28px; color:var(--azul);}

  .medio-pago{display:flex; gap:8px; margin-bottom:12px;}
  .medio-pago button{
    flex:1; padding:10px; border-radius:10px; border:1.5px solid var(--linea); background:#fff;
    font-weight:700; font-size:13px; cursor:pointer;
  }
  .medio-pago button.active{background:var(--verde); color:#fff; border-color:var(--verde);}

  .billetes{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px;}
  .billetes button{
    padding:12px; border-radius:10px; border:1.5px solid var(--linea); background:#fff;
    font-weight:800; font-size:13.5px; cursor:pointer;
  }
  .billetes button.active{background:#F6C453; border-color:#c99a1f;}

  .vuelto-box{
    background:#EEF2FF; border-radius:12px; padding:14px; text-align:center; margin-bottom:14px;
  }
  .vuelto-box .label{font-size:11.5px; color:#666; font-weight:700; text-transform:uppercase;}
  .vuelto-box .num{font-family:'Anton'; font-size:26px; color:var(--verde);}
  .vuelto-box .num.neg{color:var(--rojo);}

  .btn-confirmar-venta{
    width:100%; padding:14px; border:none; border-radius:12px; background:var(--verde); color:#fff;
    font-weight:800; font-size:15px; cursor:pointer;
  }
  .btn-confirmar-venta:disabled{background:#ccc; cursor:not-allowed;}

  .caja-msg{text-align:center; font-size:13px; padding:10px; border-radius:10px; margin-top:10px;}
  .caja-msg.ok{background:#DFF3E5; color:var(--verde);}
  .caja-msg.error{background:#FBE0DE; color:var(--rojo);}
</style>
</head>
<body>

<header>
  <h1>PANEL ADMIN — EMPANADAS GUAYACÁN 2026</h1>
  <p>Verificación de pagos · Colegio Andino Montessori</p>
</header>

<main>
  <div class="tabs">
    <button id="tabPedidos" class="active">📋 Pedidos online</button>
    <button id="tabCaja">💵 Caja rápida (stand)</button>
  </div>

  <div id="vistaPedidos">
    <div class="toolbar">
      <select id="filtroEstado">
        <option value="">Todos los estados</option>
        <option value="Pendiente">Pendiente</option>
        <option value="Verificado">Verificado</option>
        <option value="Entregado">Entregado</option>
        <option value="Rechazado">Rechazado</option>
      </select>
      <input type="text" id="buscar" placeholder="Buscar por nombre, curso o código...">
      <button id="btnRefrescar">🔄 Refrescar</button>
      <button id="btnExportar">⬇️ Exportar reporte a Drive</button>
      <span class="stock-pill" id="pillStock">Stock: -- pino / -- queso</span>
    </div>

    <div id="contenido" class="loading">Cargando pedidos...</div>
  </div>

  <div id="vistaCaja" class="hidden">
    <div class="caja-card">
      <div class="caja-prod pino">
        <div class="nombre">Empanada Pino<br><span class="disp" id="cajaDispPino">-- disponibles</span></div>
        <div class="caja-stepper">
          <button id="cajaMenosPino">–</button>
          <span class="qty" id="cajaQtyPino">0</span>
          <button id="cajaMasPino">+</button>
        </div>
      </div>
      <div class="caja-prod queso">
        <div class="nombre">Empanada Queso<br><span class="disp" id="cajaDispQueso">-- disponibles</span></div>
        <div class="caja-stepper">
          <button id="cajaMenosQueso">–</button>
          <span class="qty" id="cajaQtyQueso">0</span>
          <button id="cajaMasQueso">+</button>
        </div>
      </div>

      <div class="caja-total">
        <span style="font-size:13px;color:#666;font-weight:700;">Total</span>
        <span class="num" id="cajaTotal">$0</span>
      </div>

      <div class="medio-pago">
        <button id="cajaEfectivo" class="active">💵 Efectivo</button>
        <button id="cajaTransferencia">🏦 Transferencia</button>
      </div>

      <div id="cajaBilletesWrap">
        <div class="billetes">
          <button data-billete="exacto">Exacto</button>
          <button data-billete="5000">$5.000</button>
          <button data-billete="10000">$10.000</button>
          <button data-billete="20000">$20.000</button>
        </div>
        <div class="vuelto-box">
          <div class="label">Vuelto</div>
          <div class="num" id="cajaVuelto">$0</div>
        </div>
      </div>

      <button class="btn-confirmar-venta" id="btnConfirmarVenta" disabled>Selecciona empanadas</button>
      <div id="cajaMsg" class="caja-msg hidden"></div>
    </div>
  </div>
</main>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwCmQEoR0P5I2fwD0FKHjx1uSMl7jtWbDq7n9xqaOEOv2M3VM3PK4dGiDOGFezCQCKe/exec";

let pedidos = [];

async function cargar(){
  document.getElementById("contenido").innerHTML = '<div class="loading">Cargando pedidos...</div>';
  try{
    const [resPedidos, resStock] = await Promise.all([
      fetch(API_URL + "?action=listar").then(r => r.json()),
      fetch(API_URL + "?action=stock").then(r => r.json())
    ]);
    pedidos = resPedidos.pedidos || [];
    if(resStock.ok){
      document.getElementById("pillStock").textContent = `Stock: ${resStock.stock_pino} pino / ${resStock.stock_queso} queso`;
    }
    render();
  }catch(e){
    document.getElementById("contenido").innerHTML = '<div class="empty">No se pudo conectar con el backend. Revisa la URL de Apps Script.</div>';
  }
}

function render(){
  const filtroEstado = document.getElementById("filtroEstado").value;
  const buscar = document.getElementById("buscar").value.toLowerCase();

  let filtrados = pedidos.filter(p => {
    if(filtroEstado && p.estado !== filtroEstado) return false;
    if(buscar){
      const texto = (p.nombre + " " + p.curso + " " + p.codigo).toLowerCase();
      if(!texto.includes(buscar)) return false;
    }
    return true;
  });

  filtrados.sort((a,b) => new Date(b.fecha) - new Date(a.fecha));

  if(filtrados.length === 0){
    document.getElementById("contenido").innerHTML = '<div class="empty">No hay pedidos que coincidan.</div>';
    return;
  }

  let html = `<table><thead><tr>
    <th>Código</th><th>Etapa</th><th>Alumno</th><th>Curso</th><th>WhatsApp</th>
    <th>Pino</th><th>Queso</th><th>Total</th><th>Estado</th><th>Acciones</th>
  </tr></thead><tbody>`;

  filtrados.forEach(p => {
    html += `<tr>
      <td><strong>${p.codigo}</strong></td>
      <td>${p.etapa || "-"}</td>
      <td>${p.nombre}</td>
      <td>${p.curso}</td>
      <td>${p.whatsapp}</td>
      <td>${p.cantidad_pino}</td>
      <td>${p.cantidad_queso}</td>
      <td>$${Number(p.total).toLocaleString("es-CL")}</td>
      <td><span class="badge ${p.estado}">${p.estado}</span></td>
      <td class="actions">${botonesPorEstado(p)}</td>
    </tr>`;
  });

  html += "</tbody></table>";
  document.getElementById("contenido").innerHTML = html;

  document.querySelectorAll("button[data-accion]").forEach(btn => {
    btn.onclick = () => accionar(btn.dataset.codigo, btn.dataset.accion, btn);
  });
  document.querySelectorAll("button[data-wsp]").forEach(btn => {
    btn.onclick = () => enviarWhatsapp(btn.dataset.wsp, btn.dataset.codigo);
  });
  document.querySelectorAll("button[data-print]").forEach(btn => {
    btn.onclick = () => imprimirVoucher(btn.dataset.print);
  });
}

function botonesPorEstado(p){
  if(p.estado === "Pendiente"){
    return `
      <button class="btn-ok" data-codigo="${p.codigo}" data-accion="verificar">Verificar</button>
      <button class="btn-no" data-codigo="${p.codigo}" data-accion="rechazar">Rechazar</button>
      <button class="btn-wsp" data-wsp="comprobante" data-codigo="${p.codigo}">📲 Comprobante</button>
    `;
  }
  if(p.estado === "Verificado"){
    return `
      <button class="btn-wsp" data-wsp="aprobacion" data-codigo="${p.codigo}">📲 Aprobación</button>
      <button class="btn-entregado" data-codigo="${p.codigo}" data-accion="entregar">✅ Entregado</button>
    `;
  }
  if(p.estado === "Entregado"){
    return `<button class="btn-print" data-print="${p.codigo}">🖨️ Reimprimir voucher</button>`;
  }
  return `<span style="color:#aaa;font-size:11.5px;">—</span>`;
}

function limpiarNumero(numero){
  return String(numero).replace(/[^\d]/g, "").replace(/^0+/, "");
}

function enviarWhatsapp(tipo, codigo){
  const p = pedidos.find(x => x.codigo === codigo);
  if(!p) return;
  const numero = limpiarNumero(p.whatsapp);
  let texto = "";

  if(tipo === "comprobante"){
    texto = `Hola! 👋 Este es tu comprobante de pedido de Empanadas Guayacán 2026.%0A%0ACódigo: ${p.codigo}%0AAlumno/a: ${p.nombre}%0ACurso: ${p.curso}%0APino: ${p.cantidad_pino} · Queso: ${p.cantidad_queso}%0ATotal: $${Number(p.total).toLocaleString("es-CL")}%0A%0ATransfiere a Banco de Chile, Cuenta Vista 00-075-84210-95, a nombre de Patricia Bravo, usando tu código ${p.codigo} como glosa.%0A%0AApenas verifiquemos tu pago te avisamos para que retires en el stand. ¡Gracias por tu compra!`;
  } else {
    texto = `¡Hola! ✅ Tu pago del pedido ${p.codigo} fue verificado.%0A%0APasa a retirar tus empanadas (Pino: ${p.cantidad_pino} · Queso: ${p.cantidad_queso}) en el stand de Guayacán, mostrando tu código: ${p.codigo}.%0A%0A¡Gracias por tu compra!`;
  }

  window.open(`https://wa.me/${numero}?text=${texto}`, "_blank");
}

// ============ VOUCHER 58mm — estilo compartido ============
const ICONOS_VOUCHER = {
  persona: `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>`,
  curso: `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8l10-5 10 5-10 5-10-5z"/><path d="M6 10.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-5.5"/></svg>`,
  calendario: `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>`,
  reloj: `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>`,
  pago: `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20M6 15h4"/></svg>`,
  corazon: `<svg viewBox="0 0 24 24" width="14" height="14" fill="#000" stroke="none"><path d="M12 21s-7-4.35-9.5-8.5C1 9 2.5 5.5 6 5c2 0 3.5 1.2 4 2.5.5-1.3 2-2.5 4-2.5 3.5.5 5 4 3.5 7.5C19 16.65 12 21 12 21z"/></svg>`,
  empanada: `<svg viewBox="0 0 60 40" width="34" height="24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"><path d="M15 5l2 6M22 3l1.5 6.5M30 2v7M38 3l-1.5 6.5M45 5l-2 6"/><path d="M8 22c0-9 10-16 22-16s22 7 22 16" fill="none"/><path d="M6 22h48" stroke-dasharray="1.5 3"/></svg>`
};

function estiloVoucher(){
  return `
  @page { size: 58mm auto; margin: 0; }
  * { box-sizing: border-box; }

  html, body{
    width: 58mm !important;
    margin: 0 !important;
    padding: 0 !important;
    background: #fff !important;
  }

  body{
    width: 54mm !important;
    margin: 0 !important;
    padding: 3mm 2.5mm !important;
    font-family: 'Poppins', Arial, Helvetica, sans-serif !important;
    font-size: 12px !important;
    font-weight: 500 !important;
    line-height: 1.4 !important;
    color: #000 !important;
    background: #fff !important;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
    -webkit-font-smoothing: none !important;
    -moz-osx-font-smoothing: unset !important;
    font-smooth: never !important;
    text-rendering: optimizeSpeed !important;
    image-rendering: pixelated;
  }

  .centro{ text-align: center; }

  .logo-titulo{
    font-weight: 800 !important;
    font-size: 20px !important;
    letter-spacing: 1px;
    margin-top: 3px;
    color: #000 !important;
  }

  .logo-sub{
    font-size: 10px !important;
    font-weight: 700 !important;
    letter-spacing: 2.5px;
    color: #000 !important;
    margin-top: 1px;
  }

  .dotted{ border: none; border-top: 1.5px dotted #000 !important; margin: 8px 0; }
  .solida{ border: none; border-top: 1.6px solid #000 !important; margin: 7px 0; }

  .codigo-badge{
    display: inline-block; background: #000 !important; color: #fff !important;
    font-weight: 700 !important; font-size: 13px !important; letter-spacing: 1px;
    padding: 5px 16px; border-radius: 999px; margin: 4px 0 10px;
  }

  .icon-row{ display:flex; align-items:flex-start; gap:7px; margin: 7px 0; text-align:left; }
  .icon-row .txt .etiqueta{ font-weight: 700 !important; font-size: 11.5px !important; color: #000 !important; }
  .icon-row .txt .valor{ font-weight: 500 !important; font-size: 11.5px !important; color: #000 !important; }

  .icon-row-linea{ display:flex; align-items:center; justify-content:space-between; gap:6px; margin: 5px 0; }
  .icon-row-linea .izq{ display:flex; align-items:center; gap:6px; font-weight: 600 !important; font-size: 11px !important; color: #000 !important; }
  .icon-row-linea .der{ font-weight: 700 !important; font-size: 11px !important; color: #000 !important; }

  .item-fila{ display:flex; align-items:center; gap:7px; margin: 6px 0; }
  .item-badge{
    flex-shrink:0; width:20px; height:20px; border-radius:50%; background:#000 !important;
    color:#fff !important; font-size:9.5px !important; font-weight:700 !important;
    display:flex; align-items:center; justify-content:center;
  }
  .item-nombre{ flex:1; font-weight:500 !important; font-size:11.5px !important; color: #000 !important; }
  .item-precio{ font-weight:700 !important; font-size:11.5px !important; color: #000 !important; }

  .fila-total{ display:flex; justify-content:space-between; align-items:center; }
  .fila-total .label{ font-weight:800 !important; font-size:13.5px !important; letter-spacing:.5px; color: #000 !important; }
  .fila-total .monto{ font-weight:800 !important; font-size:16px !important; color: #000 !important; }

  .footer-sub{ font-size: 10.5px !important; font-weight: 700 !important; color: #000 !important; }
  `;
}

function imprimirVoucher(codigo){
  const p = pedidos.find(x => x.codigo === codigo);
  if(!p) return;

  const ahora = new Date();
  const fecha = ahora.toLocaleDateString("es-CL");
  const hora = ahora.toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit" });

  const lineas = [];
  if(Number(p.cantidad_pino) > 0) lineas.push({ nombre: "Empanada Pino", cant: p.cantidad_pino });
  if(Number(p.cantidad_queso) > 0) lineas.push({ nombre: "Empanada Queso", cant: p.cantidad_queso });

  const filasProductos = lineas.map((l, i) => `
    <div class="item-fila">
      <div class="item-badge">x${l.cant}</div>
      <div class="item-nombre">${l.nombre}</div>
      <div class="item-precio">$${(l.cant * 3500).toLocaleString("es-CL")}</div>
    </div>
    ${i < lineas.length - 1 ? '<hr class="dotted">' : ''}
  `).join("");

  const html = `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Voucher ${p.codigo}</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>${estiloVoucher()}</style>
</head>
<body>
  <div class="centro">
    ${ICONOS_VOUCHER.empanada}
    <div class="logo-titulo">GUAYACÁN</div>
    <div class="logo-sub">— EMPANADAS —</div>
  </div>
  <hr class="dotted">
  <div class="centro"><span class="codigo-badge">${p.codigo}</span></div>

  <div class="icon-row">
    ${ICONOS_VOUCHER.persona}
    <div class="txt"><div class="etiqueta">Alumno/a</div><div class="valor">${p.nombre}</div></div>
  </div>
  <div class="icon-row">
    ${ICONOS_VOUCHER.curso}
    <div class="txt"><div class="etiqueta">Curso</div><div class="valor">${p.curso}</div></div>
  </div>

  <hr class="dotted">
  ${filasProductos}
  <hr class="solida">
  <div class="fila-total"><span class="label">TOTAL</span><span class="monto">$${Number(p.total).toLocaleString("es-CL")}</span></div>
  <hr class="solida">

async function accionar(codigo, accion, btnEl){
  const mensajes = {
    verificar: `¿Confirmas que verificaste la transferencia del pedido ${codigo}? Se abrirá WhatsApp con el mensaje de aprobación.`,
    rechazar: `¿Rechazar el pedido ${codigo}? Se restaurará el stock reservado.`,
    entregar: `¿Confirmas que ya entregaste las empanadas del pedido ${codigo} en el stand? Se imprimirá el voucher.`
  };
  if(!confirm(mensajes[accion])) return;

  btnEl.disabled = true;
  btnEl.textContent = "...";

  const mapaAccion = { verificar: "verificar_pago", rechazar: "rechazar_pago", entregar: "marcar_entregado" };
  try{
    const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: mapaAccion[accion], codigo }) });
    const data = await res.json();
    if(!data.ok){
      alert(data.mensaje || "Ocurrió un error.");
    } else if(accion === "verificar"){
      // apenas se verifica, se abre WhatsApp solo con el mensaje de aprobación listo para enviar
      enviarWhatsapp("aprobacion", codigo);
    } else if(accion === "entregar"){
      // apenas se marca como entregado, se imprime el voucher de 58mm
      imprimirVoucher(codigo);
    }
    await cargar();
  }catch(e){
    alert("Error de conexión.");
    await cargar();
  }
}

// ============ CAJA RÁPIDA ============
const PRECIO_CAJA = 3500;
let cajaStock = { pino: 0, queso: 0 };
let cajaQty = { pino: 0, queso: 0 };
let cajaMedioPago = "Efectivo";
let cajaBilleteSeleccionado = null;

function cajaCalcTotal(){
  const totalUnidades = cajaQty.pino + cajaQty.queso;
  const total = totalUnidades * PRECIO_CAJA;
  return { total, totalUnidades };
}

function cajaRender(){
  cajaStock.pino = Number(document.getElementById("pillStock").textContent.match(/(\d+)\s*pino/)?.[1] || cajaStock.pino);
  cajaStock.queso = Number(document.getElementById("pillStock").textContent.match(/(\d+)\s*queso/)?.[1] || cajaStock.queso);

  document.getElementById("cajaDispPino").textContent = cajaStock.pino + " disponibles";
  document.getElementById("cajaDispQueso").textContent = cajaStock.queso + " disponibles";
  document.getElementById("cajaQtyPino").textContent = cajaQty.pino;
  document.getElementById("cajaQtyQueso").textContent = cajaQty.queso;
  document.getElementById("cajaMasPino").disabled = cajaQty.pino >= cajaStock.pino;
  document.getElementById("cajaMasQueso").disabled = cajaQty.queso >= cajaStock.queso;
  document.getElementById("cajaMenosPino").disabled = cajaQty.pino <= 0;
  document.getElementById("cajaMenosQueso").disabled = cajaQty.queso <= 0;

  const { total, totalUnidades } = cajaCalcTotal();
  document.getElementById("cajaTotal").textContent = "$" + total.toLocaleString("es-CL");

  cajaActualizarVuelto();

  const btn = document.getElementById("btnConfirmarVenta");
  if(totalUnidades === 0){
    btn.disabled = true;
    btn.textContent = "Selecciona empanadas";
  } else if(cajaMedioPago === "Efectivo" && cajaBilleteSeleccionado === null){
    btn.disabled = true;
    btn.textContent = "Elige con qué pagó";
  } else {
    const vuelto = cajaGetVuelto();
    if(cajaMedioPago === "Efectivo" && vuelto < 0){
      btn.disabled = true;
      btn.textContent = "Monto insuficiente";
    } else {
      btn.disabled = false;
      btn.textContent = "Confirmar venta · $" + total.toLocaleString("es-CL");
    }
  }
}

function cajaGetVuelto(){
  const { total } = cajaCalcTotal();
  if(cajaMedioPago !== "Efectivo" || cajaBilleteSeleccionado === null) return 0;
  const montoRecibido = cajaBilleteSeleccionado === "exacto" ? total : Number(cajaBilleteSeleccionado);
  return montoRecibido - total;
}

function cajaActualizarVuelto(){
  const vuelto = cajaGetVuelto();
  const el = document.getElementById("cajaVuelto");
  el.textContent = "$" + vuelto.toLocaleString("es-CL");
  el.classList.toggle("neg", vuelto < 0);
}

document.getElementById("cajaMasPino").onclick = () => { if(cajaQty.pino < cajaStock.pino){ cajaQty.pino++; cajaRender(); } };
document.getElementById("cajaMenosPino").onclick = () => { if(cajaQty.pino > 0){ cajaQty.pino--; cajaRender(); } };
document.getElementById("cajaMasQueso").onclick = () => { if(cajaQty.queso < cajaStock.queso){ cajaQty.queso++; cajaRender(); } };
document.getElementById("cajaMenosQueso").onclick = () => { if(cajaQty.queso > 0){ cajaQty.queso--; cajaRender(); } };

document.getElementById("btnConfirmarVenta").onclick = async () => {
  const btn = document.getElementById("btnConfirmarVenta");
  const msg = document.getElementById("cajaMsg");
  msg.classList.add("hidden");
  btn.disabled = true;
  const original = btn.textContent;
  btn.textContent = "Registrando...";

  const { total } = cajaCalcTotal();
  const montoRecibido = cajaMedioPago === "Efectivo"
    ? (cajaBilleteSeleccionado === "exacto" ? total : Number(cajaBilleteSeleccionado))
    : total;

  try{
    const res = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({
        action: "venta_presencial",
        cantidad_pino: cajaQty.pino,
        cantidad_queso: cajaQty.queso,
        medio_pago: cajaMedioPago,
        monto_recibido: montoRecibido
      })
    });
    const data = await res.json();

    if(!data.ok){
      msg.textContent = data.mensaje || "No se pudo registrar la venta.";
      msg.className = "caja-msg error";
      btn.disabled = false;
      btn.textContent = original;
      return;
    }

    document.getElementById("pillStock").textContent = `Stock: ${data.stock_pino} pino / ${data.stock_queso} queso`;
    msg.innerHTML = `✅ Venta ${data.codigo} registrada` + (data.vuelto > 0 ? ` — Vuelto: $${data.vuelto.toLocaleString("es-CL")}` : "") +
      ` <button class="btn-print" id="btnReimprimirCaja" style="margin-left:8px;">🖨️ Reimprimir voucher</button>`;
    msg.className = "caja-msg ok";

    ultimaVentaCaja = {
      codigo: data.codigo,
      cantidad_pino: cajaQty.pino,
      cantidad_queso: cajaQty.queso,
      total: total,
      medioPago: cajaMedioPago,
      montoRecibido: montoRecibido,
      vuelto: data.vuelto
    };
    imprimirVoucherCaja(ultimaVentaCaja);
    document.getElementById("btnReimprimirCaja").onclick = () => imprimirVoucherCaja(ultimaVentaCaja);

    cajaQty = { pino: 0, queso: 0 };
    cajaBilleteSeleccionado = null;
    document.querySelectorAll(".billetes button").forEach(b => b.classList.remove("active"));
    cajaRender();

  }catch(e){
    msg.textContent = "Error de conexión.";
    msg.className = "caja-msg error";
    btn.disabled = false;
    btn.textContent = original;
  }
};
